<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url("lan.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
    }

    /* Title at top center */
    .title {
      text-align: center;
      font-size: 100px;
      color: pink;
      margin-top: 40px;
      font-family:'Times New Roman', Times, serif;
      text-shadow: 2px 2px 10px black;
    }

    /* Center container */
    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
    }

    /* Modern button */
    .btn {
      display: inline-block;
      padding: 18px 40px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      border: 2px solid white;
      backdrop-filter: blur(6px);
      transition: 0.3s;
    }

    .btn:hover {
      background: pink;
      transform: scale(1.08);
      border-color:black;
    }
  </style>
</head>

<body>

  <!-- Top Title -->
  <h1 class="title">HELLO!!</h1>

  <!-- Center Button -->
  <div class="center">
    <a href="lolz.html" class="btn">CLICK ME!!</a>
  </div>

</body>
</html>
